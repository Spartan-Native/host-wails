# Tests both halves of the adapter: the Go module (repository root) and the npm workspace (npm/).
# Also called by release.yml before anything is published.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go module (${{ matrix.os }})
    # Each OS runs its own reader. macOS also vets the Windows and Linux code and runs the
    # race detector. Linux builds with purego, so no GTK or WebKit packages are needed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            test: go test -race ./...
          - os: ubuntu-latest
            test: go test -tags purego ./...
          - os: windows-latest
            test: go test ./...
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: ${{ matrix.test }}

      - name: Vet (darwin, windows, linux)
        if: runner.os == 'macOS'
        run: make vet

  npm:
    name: npm package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    permissions:
      contents: read
      # Installs @spartan-native/theme and @spartan-native/host-conformance from GitHub Packages.
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: npm/.nvmrc
          cache: npm
          cache-dependency-path: npm/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@spartan-native'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Test (adapter + host-conformance suite)
        run: npm test

      - name: Build
        run: npm run build
